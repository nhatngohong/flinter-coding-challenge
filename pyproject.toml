[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flinter-coding-challenge"
version = "0.1.0"
description = "Polars based advertising performance aggregator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["polars>=1.30", "python-dotenv>=1.0", "psutil>=5.9"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
flinter-challenge = "flinter_coding_challenge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
